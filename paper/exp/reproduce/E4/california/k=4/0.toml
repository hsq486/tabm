# E4 集成规模分析：california × TabM × k ∈ {1,2,4,8,16,32}
# 固定除 k 外的所有超参（同 E3 主配置），仅改 k 以隔离集成规模效应
seed = 0
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
amp = true

[data]
cache = true
path = "data/california"
num_policy = "noisy-quantile"

[optimizer]
type = "AdamW"
lr = 0.0008468726533903873
weight_decay = 0.0

[model]
arch_type = "tabm"
k = 4
share_training_batches = true

[model.backbone]
type = "MLP"
n_blocks = 2
d_block = 256
dropout = 0.1697377329739597
