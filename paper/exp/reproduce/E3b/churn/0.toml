# E3b 对照：TabM + 分段线性数值嵌入（消除与 MLP† 的嵌入混淆）
# 来源：exp/tabm-sharetrainingbatches-piecewiselinear/churn/0-evaluation/0.toml
# 缩减：k 32 -> 8，n_blocks 4 -> 2，d_block 656 -> 256（CPU 预算）
seed = 0
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
amp = true

[data]
cache = true
path = "data/churn"
num_policy = "noisy-quantile"
cat_policy = "ordinal"

[optimizer]
type = "AdamW"
lr = 0.0014215026863743632
weight_decay = 0.0

[model]
arch_type = "tabm"
k = 8
share_training_batches = true

[model.backbone]
type = "MLP"
n_blocks = 2
d_block = 256
dropout = 0.49476959904460954

[model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 28

[bins]
n_bins = 37
