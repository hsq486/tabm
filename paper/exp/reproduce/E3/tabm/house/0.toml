# E3 主方法：TabM（参数高效集成，权重共享开启）
# 来源：exp/tabm-sharetrainingbatches/house/0-evaluation/0.toml
# 缩减：k 32 -> 8，n_blocks 5 -> 2，d_block 816 -> 256（CPU 预算）
seed = 0
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
amp = true

[data]
cache = true
path = "data/house"
num_policy = "noisy-quantile"

[optimizer]
type = "AdamW"
lr = 0.00426725554229699
weight_decay = 0.014579531645605904

[model]
arch_type = "tabm"
k = 8
share_training_batches = true

[model.backbone]
type = "MLP"
n_blocks = 2
d_block = 256
dropout = 0.0
