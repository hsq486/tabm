name: CI

on:
  push:
    branches: [main, 'experiment/**']
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package and test dependencies
        run: |
          pip install -e .
          pip install pytest ruff scikit-learn scipy loguru tomli tomli-w

      - name: Lint
        # `tabm.py` and `tabm_reference.py` are vendored from the upstream
        # repository and are kept byte-identical, so they are not linted here.
        run: |
          ruff check tests
          ruff format --check tests

      - name: Test
        run: pytest -q
